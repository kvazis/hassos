##################################################
## Актуалізовано: 2026-10-22
##################################################

kn_heating:

  ##################################################
  ## CUSTOMIZE
  ##################################################

  homeassistant:
    customize:

      ##################################################
      ## PHYSICAL
      ##################################################

      climate.0xa4c13833d5060f8b:
        friendly_name: Кухня TRV
        icon: mdi:radiator

      sensor.0xa4c13833d5060f8b_local_temperature:
        friendly_name: Кухня TRV - власна температура
        icon: mdi:thermometer

      number.0xa4c13833d5060f8b_external_temperature_input:
        friendly_name: Кухня TRV - зовнішня температура
        unit_of_measurement: "°C"
        icon: mdi:thermometer-chevron-up

      ##################################################
      ## HELPERS
      ##################################################

      switch.kn_radiator_mode:
        friendly_name: Кухня - режим опалення
        icon: mdi:radiator

      ##################################################
      ## AUTOMATION
      ##################################################

      automation.kn_heat_temperature_sync:
        friendly_name: Кухня - синхронізація температури

      automation.kn_heat_control:
        friendly_name: Кухня - керування опаленням

  ##################################################
  ## RECORDER
  ##################################################

  recorder:
    include:
      entities:
        - climate.0xa4c13833d5060f8b
        - sensor.0xa4c13833d5060f8b_local_temperature

  ##################################################
  ## INPUT NUMBER
  ##################################################

  input_number:

    kn_heat_comfort_temperature:
      name: Кухня - комфортна температура
      icon: mdi:thermometer
      min: 5
      max: 30
      step: 0.5
      unit_of_measurement: "°C"
      mode: box

    kn_heat_eco_temperature:
      name: Кухня - еко температура
      icon: mdi:leaf
      min: 5
      max: 30
      step: 0.5
      unit_of_measurement: "°C"
      mode: box

    kn_heat_open_window_temperature:
      name: Кухня - температура провітрювання
      icon: mdi:window-open-variant
      min: 5
      max: 30
      step: 0.5
      unit_of_measurement: "°C"
      mode: box

  ##################################################
  ## MQTT
  ##################################################

  mqtt:
    switch:
      - name: kn_radiator_mode
        unique_id: kn_radiator_mode
        state_topic: "states/kn_thermostat"
        command_topic: "states/kn_thermostat"
        payload_on: "ON"
        payload_off: "OFF"
        state_on: "ON"
        state_off: "OFF"
        retain: true

  ##################################################
  ## AUTOMATION
  ##################################################

  automation:

    ##################################################
    ## СИНХРОНІЗАЦІЯ ТЕМПЕРАТУРИ
    ##################################################

    - alias: kn_heat_temperature_sync
      id: kn_heat_temperature_sync
      description: Сінхронізація температури при перевищені 0.5 °C
      initial_state: true
      mode: single
      triggers:
        - trigger: state
          entity_id: sensor.0x00158d0001581109_temperature
          to: null
      conditions:
        - condition: template
          value_template: >-
            {% set measured = states('sensor.0x00158d0001581109_temperature') %}
            {% set sent = states('number.0xa4c13833d5060f8b_external_temperature_input') %}
            {{ is_number(measured) and is_number(sent)
               and ((measured | float - sent | float) | abs | round(3)) > 0.5 }}
      actions:
        - action: number.set_value
          target:
            entity_id: number.0xa4c13833d5060f8b_external_temperature_input
          data:
            value: "{{ states('sensor.0x00158d0001581109_temperature') | float }}"

    ##################################################
    ## КЕРУВАННЯ ОПАЛЕННЯМ
    ##################################################

    - alias: kn_heat_control
      id: kn_heat_control
      description: Режим опалення, провітрювання і нічний режим TRV на кухні
      initial_state: true
      mode: restart
      triggers:
        - trigger: homeassistant
          event: start
        - trigger: state
          entity_id:
            - switch.kn_radiator_mode
            - binary_sensor.kn_aeration
            - binary_sensor.night_time
            - input_number.kn_heat_comfort_temperature
            - input_number.kn_heat_eco_temperature
            - input_number.kn_heat_open_window_temperature
      conditions:
        - condition: state
          entity_id: switch.control_mode
          state: "on"
      actions:
        - variables:
            trv: climate.0xa4c13833d5060f8b
            target: >-
              {% if is_state('binary_sensor.kn_aeration', 'on') %}
                {{ states('input_number.kn_heat_open_window_temperature') | float(5) }}
              {% elif is_state('binary_sensor.night_time', 'on') %}
                {{ states('input_number.kn_heat_eco_temperature') | float(5) }}
              {% else %}
                {{ states('input_number.kn_heat_comfort_temperature') | float(5) }}
              {% endif %}
        - choose:

            ##################################################
            ## РЕЖИМ ОПАЛЕННЯ УВІМКНЕНО
            ##################################################

            - conditions:
                - condition: state
                  entity_id: switch.kn_radiator_mode
                  state: "on"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ states(trv) != 'heat' }}"
                  then:
                    - action: climate.set_hvac_mode
                      target:
                        entity_id: "{{ trv }}"
                      data:
                        hvac_mode: heat
                - if:
                    - condition: template
                      value_template: >-
                        {{ state_attr(trv, 'temperature') | float(0) != target | float(0) }}
                  then:
                    - action: climate.set_temperature
                      target:
                        entity_id: "{{ trv }}"
                      data:
                        temperature: "{{ target | float(5) }}"

            ##################################################
            ## РЕЖИМ ОПАЛЕННЯ ВИМКНЕНО
            ##################################################

            - conditions:
                - condition: state
                  entity_id: switch.kn_radiator_mode
                  state: "off"
                - condition: template
                  value_template: "{{ states(trv) != 'off' }}"
              sequence:
                - action: climate.set_hvac_mode
                  target:
                    entity_id: "{{ trv }}"
                  data:
                    hvac_mode: "off"