##################################################
## Актуалізовано: 2026-04-05
##################################################

bt_reboot:

  ##################################################
  ## CUSTOMIZE
  ##################################################

  homeassistant:
    customize:
      binary_sensor.bt_ceiling_unavailable:
        friendly_name: Ванна кімната - недоступність люстри
        icon: mdi:ceiling-light

      input_number.bt_ceiling_reboot_attempts:
        friendly_name: Ванна кімната - спроби перезавантаження люстри

      input_number.bt_switch_power_on_attempts:
        friendly_name: Ванна кімната - спроби ввімкнення вимикача

      automation.bt_ceiling_reboot:
        friendly_name: Ванна кімната - перезавантаження люстри
        icon: mdi:restart

      automation.bt_ceiling_reboot_attempts_reset:
        friendly_name: Ванна кімната - скидання спроб люстри
        icon: mdi:counter

      automation.bt_ceiling_reboot_failed_notify:
        friendly_name: Ванна кімната - сповіщення про невдале перезавантаження
        icon: mdi:alert

      automation.bt_switch_power_turn_on_check:
        friendly_name: Ванна кімната - перевірка ввімкнення живлення люстри
        icon: mdi:light-switch

      automation.bt_switch_power_turn_on_check_reset:
        friendly_name: Ванна кімната - скидання спроб ввімкнення вимикача
        icon: mdi:counter

      automation.bt_switch_power_turn_on_check_failed_notify:
        friendly_name: Ванна кімната - сповіщення про невдале ввімкнення вимикача
        icon: mdi:alert

      automation.bt_switch_state_refresh_check:
        friendly_name: Ванна кімната - примусове оновлення стану вимикача
        icon: mdi:update

  ##################################################
  ## TEMPLATE
  ##################################################

  template:
    - binary_sensor:
        - name: bt_ceiling_unavailable
          unique_id: bt_ceiling_unavailable
          state: >
            {{ is_state('light.yeelight_ceiling3_0x45727f2', 'unavailable') }}
          delay_on:
            minutes: 3
          device_class: problem

  ##################################################
  ## INPUT_NUMBER
  ##################################################

  input_number:

    bt_ceiling_reboot_attempts:
      name: bt_ceiling_reboot_attempts
      min: 0
      max: 3
      step: 1

    # [НОВИЙ] Лічильник для bt_switch_power_turn_on_check
    bt_switch_power_on_attempts:
      name: bt_switch_power_on_attempts
      min: 0
      max: 3
      step: 1

  ##################################################
  ## AUTOMATION
  ##################################################

  automation:

    - alias: bt_ceiling_reboot
      id: bt_ceiling_reboot
      description: Ванна кімната - перезавантаження люстри
      initial_state: true
      mode: single
      trigger:
        - platform: time_pattern
          minutes: "/5"
        # Реагуємо одразу при появі проблеми, не чекаємо до 5 хвилин
        - platform: state
          entity_id: binary_sensor.bt_ceiling_unavailable
          to: "on"
      condition:
        - condition: state
          entity_id: binary_sensor.bt_ceiling_unavailable
          state: "on"
        - condition: state
          entity_id: switch.control_mode
          state: "on"
        - condition: state
          entity_id: binary_sensor.electricity_internal
          state: "off"
        - condition: template
          value_template: "{{ states('input_number.bt_ceiling_reboot_attempts') | int < 3 }}"
        # [НОВИЙ] Перевіряємо що вимикач взагалі доступний перед дією
        - condition: template
          value_template: "{{ not is_state('switch.0x00158d000a8244b4_right', 'unavailable') }}"
      action:
        - action: switch.turn_off
          data: {}
          target:
            entity_id: switch.0x00158d000a8244b4_right
        # [ЗМІНЕНО] Збільшено з 5 до 10 секунд для надійного скидання Yeelight
        - delay: 00:00:10
        - action: switch.turn_on
          data: {}
          target:
            entity_id: switch.0x00158d000a8244b4_right
        - action: input_number.increment
          target:
            entity_id: input_number.bt_ceiling_reboot_attempts
        # Затримка щоб input_number встиг оновитись перед формуванням повідомлення
        - delay: 00:00:01
        - action: telegram_bot.send_message
          data:
            message: >-
              {{"\U0001F916"}} Ванна кімната, перезавантаження люстри (спроба {{ states('input_number.bt_ceiling_reboot_attempts') | int }}/3) {{ states('sensor.time_date') }}
            chat_id:
              - !secret chat_id_log

    - alias: bt_ceiling_reboot_attempts_reset
      id: bt_ceiling_reboot_attempts_reset
      description: Ванна кімната - скидання спроб перезавантаження люстри
      initial_state: true
      trigger:
        - platform: state
          entity_id: binary_sensor.bt_ceiling_unavailable
          from: "on"
          to: "off"
      condition:
        - condition: state
          entity_id: switch.control_mode
          state: "on"
        - condition: template
          value_template: "{{ states('input_number.bt_ceiling_reboot_attempts') | int > 0 }}"
      action:
        - action: input_number.set_value
          target:
            entity_id: input_number.bt_ceiling_reboot_attempts
          data:
            value: 0
        - action: telegram_bot.send_message
          data:
            message: >-
              {{"\U0001F916"}} Ванна кімната - люстра успішно відновила роботу, лічильник скинуто
            chat_id:
              - !secret chat_id_log


    - alias: bt_ceiling_reboot_failed_notify
      id: bt_ceiling_reboot_failed_notify
      description: Ванна кімната - сповіщення про вичерпання спроб перезавантаження
      initial_state: true
      trigger:
        - platform: numeric_state
          entity_id: input_number.bt_ceiling_reboot_attempts
          above: 2
      condition:
        - condition: state
          entity_id: binary_sensor.bt_ceiling_unavailable
          state: "on"
        - condition: state
          entity_id: switch.control_mode
          state: "on"
      action:
        # Затримка щоб покрити випадок коли третя спроба виявилась вдалою
        - delay: 00:00:30
        # Повторна перевірка після затримки
        - condition: state
          entity_id: binary_sensor.bt_ceiling_unavailable
          state: "on"
        - action: telegram_bot.send_message
          data:
            message: >-
              {{"\u26A0\uFE0F"}} Ванна кімната - люстра НЕ відновилась після 3 спроб! Потрібне ручне втручання {{ states('sensor.time_date') }}
            chat_id:
              - !secret chat_id_log


    - alias: bt_switch_power_turn_on_check
      id: bt_switch_power_turn_on_check
      description: Ванна кімната - перевірка стану вимикача
      initial_state: true
      mode: single
      trigger:
        - platform: time_pattern
          minutes: "/7"
      condition:
        - condition: template
          value_template: "{{ states('switch.0x00158d000a8244b4_right') == 'off' }}"
        - condition: state
          entity_id: switch.control_mode
          state: "on"
        - condition: state
          entity_id: binary_sensor.electricity_internal
          state: "off"
        # [НОВИЙ] Захист від нескінченного циклу
        - condition: template
          value_template: "{{ states('input_number.bt_switch_power_on_attempts') | int < 3 }}"
      action:
        - action: telegram_bot.send_message
          data:
            message: >-
              {{"\U0001F916"}} Ванна кімната - вимикач off на polling, вмикаю (спроба {{ states('input_number.bt_switch_power_on_attempts') | int + 1 }}/3) {{ states('sensor.time_date') }}
            chat_id:
              - !secret chat_id_log
        - delay: 00:00:10
        - action: switch.turn_on
          data: {}
          target:
            entity_id: switch.0x00158d000a8244b4_right
        - action: input_number.increment
          target:
            entity_id: input_number.bt_switch_power_on_attempts


    - alias: bt_switch_power_turn_on_check_reset
      id: bt_switch_power_turn_on_check_reset
      description: Ванна кімната - скидання спроб ввімкнення вимикача
      initial_state: true
      trigger:
        - platform: state
          entity_id: switch.0x00158d000a8244b4_right
          to: "on"
      condition:
        - condition: template
          value_template: "{{ states('input_number.bt_switch_power_on_attempts') | int > 0 }}"
      action:
        - action: input_number.set_value
          target:
            entity_id: input_number.bt_switch_power_on_attempts
          data:
            value: 0
        - action: telegram_bot.send_message
          data:
            message: >-
              {{"\U0001F916"}} Ванна кімната - вимикач відновився, лічильник скинуто
            chat_id:
              - !secret chat_id_log


    - alias: bt_switch_power_turn_on_check_failed_notify
      id: bt_switch_power_turn_on_check_failed_notify
      description: Ванна кімната - сповіщення про вичерпання спроб ввімкнення вимикача
      initial_state: true
      trigger:
        - platform: numeric_state
          entity_id: input_number.bt_switch_power_on_attempts
          above: 2
      condition:
        - condition: template
          value_template: "{{ states('switch.0x00158d000a8244b4_right') == 'off' }}"
        - condition: state
          entity_id: switch.control_mode
          state: "on"
      action:

        - delay: 00:00:30
        # Повторна перевірка після затримки
        - condition: template
          value_template: "{{ states('switch.0x00158d000a8244b4_right') == 'off' }}"
        - action: telegram_bot.send_message
          data:
            message: >-
              {{"\u26A0\uFE0F"}} Ванна кімната - вимикач НЕ ввімкнувся після 3 спроб! Потрібне ручне втручання {{ states('sensor.time_date') }}
            chat_id:
              - !secret chat_id_log


    - alias: bt_switch_state_refresh_check
      id: bt_switch_state_refresh_check
      description: Ванна кімната - примусове оновлення стану вимикача
      initial_state: true
      trigger:
        - platform: time_pattern
          minutes: "/15"
      condition:
        - condition: state
          entity_id: switch.control_mode
          state: "on"
        - condition: state
          entity_id: binary_sensor.electricity_internal
          state: "off"
      action:
        - action: mqtt.publish
          data:
            topic: zigstar_poe/BT Aqara D1 Enter/get
            payload: '{ "state_right": "" }'