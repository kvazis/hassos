##################################################
## Актуалізовано: 2026-10-22
##################################################

bt_boiler:

  ##################################################
  ## CUSTOMIZE
  ##################################################

  homeassistant:
    customize:

      switch.0x00158d0003584401:
        friendly_name: Ванна - бойлер
        icon: mdi:water-boiler

      binary_sensor.0x00158d0003584401_switch:
        friendly_name: Ванна - історія ввімкнень бойлера

      sensor.0x00158d0003584401_power:
        friendly_name: Ванна - потужність бойлера

      sensor.0x00158d0003584401_energy:
        friendly_name: Ванна - бойлер енергія
        device_class: energy
        unit_of_measurement: kWh
        icon: mdi:chart-line
        state_class: total_increasing

      sensor.bt_boiler_energy_meter:
        friendly_name: Ванна - бойлер споживання (день)
        unit_of_measurement: kWh
        device_class: energy
        state_class: total

      switch.0x00158d0003584401_mode:
        friendly_name: Ванна - режим бойлера
        icon: mdi:water-boiler

      automation.0x00158d0003584401_guard:
        friendly_name: Ванна - заборона ввімкнення

      automation.0x00158d0003584401_on:
        friendly_name: Ванна - ввімкнення бойлера

      automation.0x00158d0003584401_battery_off:
        friendly_name: Ванна - вимкнення по заряду батареї

      automation.0x00158d0003584401_off:
        friendly_name: Ванна - вимкнення бойлера

  ##################################################
  ## RECORDER
  ##################################################

  recorder:
    include:
      entities:
        - binary_sensor.0x00158d0003584401_switch
        - sensor.0x00158d0003584401_power
        - sensor.0x00158d0003584401_energy
        - sensor.bt_boiler_energy_meter

  ##################################################
  ## UTILITY_METER
  ##################################################

  utility_meter:

    bt_boiler_energy_meter:
      source: sensor.0x00158d0003584401_energy
      unique_id: bt_boiler_energy_meter
      cycle: daily

  ##################################################
  ## TEMPLATE
  ##################################################

  template:

    - binary_sensor:

        ##################################################
        ## СТАН БОЙЛЕРА
        ##################################################

        - name: 0x00158d0003584401_switch
          unique_id: 0x00158d0003584401_switch
          state: >
            {{ is_state('switch.0x00158d0003584401', 'on') }}
          delay_on: "00:00:01"
          delay_off: "00:00:01"
          device_class: power

  ##################################################
  ## MQTT
  ##################################################

  mqtt:

    switch:
      - name: 0x00158d0003584401_mode
        unique_id: 0x00158d0003584401_mode
        state_topic: "states/0x00158d0003584401/mode"
        command_topic: "states/0x00158d0003584401/mode"
        payload_on: "ON"
        payload_off: "OFF"
        state_on: "ON"
        state_off: "OFF"
        retain: true

  ##################################################
  ## AUTOMATION
  ##################################################

  automation:

    ##################################################
    ## ЗАБОРОНА ВВІМКНЕННЯ
    ##################################################

    - alias: 0x00158d0003584401_guard
      id: 0x00158d0003584401_guard
      description: Вимкнення розетки при спробі ввімкнення, якщо це заборонено
      initial_state: true

      trigger:
        - platform: state
          entity_id: binary_sensor.0x00158d0003584401_switch
          from: "off"
          to: "on"

      action:
        - choose:

            # режим бойлера вимкнено
            - conditions:
                - condition: state
                  entity_id: switch.0x00158d0003584401_mode
                  state: "off"
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: switch.0x00158d0003584401

                - action: telegram_bot.send_message
                  data:
                    chat_id:
                      - !secret chat_id_group_tech
                    message: |
                      🤖 Ванна - бойлер ввімкнення заборонено (режим вимкнено) {{ states('sensor.time_date') }}

            # немає електрики від міста і заряд <= 70%
            - conditions:
                - condition: state
                  entity_id: binary_sensor.electricity
                  state: "on"
                - condition: numeric_state
                  entity_id: sensor.deye_sun15_battery
                  below: 71
              sequence:
                - action: switch.turn_off
                  target:
                    entity_id: switch.0x00158d0003584401

                - action: telegram_bot.send_message
                  data:
                    chat_id:
                      - !secret chat_id_group_tech
                    message: |
                      🤖 Ванна - бойлер ввімкнення заборонено (батарея {{ states('sensor.deye_sun15_battery') }}%) {{ states('sensor.time_date') }}

    ##################################################
    ## ВВІМКНЕННЯ БОЙЛЕРА
    ##################################################

    - alias: 0x00158d0003584401_on
      id: 0x00158d0003584401_on
      description: Ввімкнення бойлера при активації режиму або поверненні електрики (затримка 5 хв)
      initial_state: true
      mode: restart

      trigger:
        - platform: state
          entity_id: switch.0x00158d0003584401_mode
          from: "off"
          to: "on"
          id: mode

        - platform: state
          entity_id: binary_sensor.electricity
          from: "on"
          to: "off"
          id: electricity

      condition: []

      action:
        # затримка тільки після повернення електрики
        - if:
            - condition: trigger
              id: electricity
          then:
            - delay: "00:05:00"

        # умови перевіряються після затримки
        - condition: state
          entity_id: switch.control_mode
          state: "on"

        - condition: state
          entity_id: switch.0x00158d0003584401_mode
          state: "on"

        - condition: or
          conditions:
            - condition: state
              entity_id: binary_sensor.electricity
              state: "off"
            - condition: numeric_state
              entity_id: sensor.deye_sun15_battery
              above: 70

        # нічого не робимо і не пишемо, якщо бойлер уже працює
        - condition: state
          entity_id: switch.0x00158d0003584401
          state: "off"

        - action: switch.turn_on
          target:
            entity_id: switch.0x00158d0003584401

        - action: telegram_bot.send_message
          data:
            chat_id:
              - !secret chat_id_group_tech
            message: >
              {% if trigger.id == 'electricity' %}
              🤖 Ванна - бойлер ввімкнення (електрика повернулась, затримка 5 хв) {{ states('sensor.time_date') }}
              {% else %}
              🤖 Ванна - бойлер ввімкнення (режим активовано) {{ states('sensor.time_date') }}
              {% endif %}

    ##################################################
    ## ВИМКНЕННЯ ПО ЗАРЯДУ БАТАРЕЇ
    ##################################################

    - alias: 0x00158d0003584401_battery_off
      id: 0x00158d0003584401_battery_off
      description: Вимкнення бойлера при заряді батареї 70% і нижче, коли немає електрики від міста
      initial_state: true

      trigger:
        - platform: numeric_state
          entity_id: sensor.deye_sun15_battery
          below: 71   # тобто <= 70%

        - platform: state
          entity_id: binary_sensor.electricity
          from: "off"
          to: "on"

      condition:
        - condition: state
          entity_id: switch.control_mode
          state: "on"

        - condition: state
          entity_id: binary_sensor.electricity
          state: "on"

        - condition: numeric_state
          entity_id: sensor.deye_sun15_battery
          below: 71

        - condition: state
          entity_id: switch.0x00158d0003584401
          state: "on"

      action:
        - action: switch.turn_off
          target:
            entity_id: switch.0x00158d0003584401

        - action: telegram_bot.send_message
          data:
            chat_id:
              - !secret chat_id_group_tech
            message: |
              🤖 Ванна - бойлер вимкнення (батарея {{ states('sensor.deye_sun15_battery') }}%) {{ states('sensor.time_date') }}

    ##################################################
    ## ВИМКНЕННЯ БОЙЛЕРА
    ##################################################

    - alias: 0x00158d0003584401_off
      id: 0x00158d0003584401_off
      description: Вимкнення бойлера при вимкненні режиму
      initial_state: true

      trigger:
        - platform: state
          entity_id: switch.0x00158d0003584401_mode
          from: "on"
          to: "off"

      condition:
        - condition: state
          entity_id: switch.control_mode
          state: "on"

      action:
        - action: switch.turn_off
          target:
            entity_id: switch.0x00158d0003584401

        - action: telegram_bot.send_message
          data:
            chat_id:
              - !secret chat_id_group_tech
            message: |
              🤖 Ванна - бойлер вимкнення (режим вимкнено) {{ states('sensor.time_date') }}