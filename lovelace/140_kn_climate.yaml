##################   Клімат
title: Кухня Клімат
icon: phu:outdoor-motion-sensor-temperature
sections:

############################ Колонка 1 ############################
  - type: grid
    cards:

      - type: markdown
        content: >
          ## Клімат

      - type: markdown
        content: >
          ### Датчики та сенсори

      - type: horizontal-stack
        cards:

          - type: custom:mushroom-template-card
            primary: Провітрювання
            secondary: |-
              {% if is_state("binary_sensor.kn_aeration", "off") %}
              Усе закрито
              {% else %}
              Провітрюється
              {% endif %}
            layout: vertical
            entity: binary_sensor.kn_aeration
            icon: |-
              {% if is_state("binary_sensor.kn_aeration", "off") %}
              phu:tilt-window-closed
              {% else %}
              phu:tilt-window-opened
              {% endif %}
            multiline_secondary: true
            icon_color: |-
              {% if is_state("binary_sensor.kn_aeration", "off") %}
              grey
              {% else %}
              light-blue
              {% endif %}
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Вікно
            secondary: |-
              {% if is_state("binary_sensor.0x00158d0001a99562_contact", "off") %}
              Закрито
              {% else %}
              Відкрито
              {% endif %}
            layout: vertical
            entity: binary_sensor.0x00158d0001a99562_contact
            icon: |-
              {% if is_state("binary_sensor.0x00158d0001a99562_contact", "off") %}
              phu:lift-in-window-closed
              {% else %}
              phu:lift-in-window-open1
              {% endif %}
            multiline_secondary: true
            icon_color: |-
              {% if is_state("binary_sensor.0x00158d0001a99562_contact", "off") %}
              grey
              {% else %}
              light-blue
              {% endif %}
            tap_action:
              action: more-info

      - type: horizontal-stack
        cards:

          - type: custom:mushroom-template-card
            primary: Двері на балкон
            secondary: |-
              {% if is_state("binary_sensor.0x00158d0001a20885_contact", "off") %}
              Закриті
              {% else %}
              Відкриті
              {% endif %}
            layout: vertical
            entity: binary_sensor.0x00158d0001a20885_contact
            icon: |-
              {% if is_state("binary_sensor.0x00158d0001a20885_contact", "off") %}
              phu:panel-glass-door2-close
              {% else %}
              phu:panel-glass-door2-open
              {% endif %}
            multiline_secondary: true
            icon_color: |-
              {% if is_state("binary_sensor.0x00158d0001a20885_contact", "off") %}
              grey
              {% else %}
              amber
              {% endif %}
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Балконне вікно
            secondary: |-
              {% if is_state("binary_sensor.0x00158d0001a4a394_contact", "off") %}
              Закрито
              {% else %}
              Відкрито
              {% endif %}
            layout: vertical
            entity: binary_sensor.0x00158d0001a4a394_contact
            icon: |-
              {% if is_state("binary_sensor.0x00158d0001a4a394_contact", "off") %}
              phu:double-window-closed
              {% else %}
              phu:double-window-open
              {% endif %}
            multiline_secondary: true
            icon_color: |-
              {% if is_state("binary_sensor.0x00158d0001a4a394_contact", "off") %}
              grey
              {% else %}
              light-blue
              {% endif %}
            tap_action:
              action: more-info

      - type: markdown
        content: >
          ### Кухня

      - type: horizontal-stack
        cards:

          - type: custom:mushroom-template-card
            primary: Температура
            secondary: |-
              {{ states('sensor.0x00158d0001581109_temperature') }} С°
            layout: vertical
            entity: sensor.0x00158d0001581109_temperature
            icon_color: |-
              {% if states("sensor.0x00158d0001581109_temperature")|float <= -10 %}
              indigo
              {% elif states("sensor.0x00158d0001581109_temperature")|float <= 0 %}
              blue
              {% elif states("sensor.0x00158d0001581109_temperature")|float <= 10 %}
              light-blue
              {% elif states("sensor.0x00158d0001581109_temperature")|float <= 20 %}
              cyan
              {% elif states("sensor.0x00158d0001581109_temperature")|float <= 25 %}
              yellow
              {% elif states("sensor.0x00158d0001581109_temperature")|float <= 30 %}
              amber
              {% elif states("sensor.0x00158d0001581109_temperature")|float <= 40 %}
              orange
              {% endif %}
            icon: mdi:temperature-celsius
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Вологість
            secondary: |-
              {{ states('sensor.0x00158d0001581109_humidity') }} %
            layout: vertical
            entity: sensor.0x00158d0001581109_humidity
            icon_color: |-
              {% if states("sensor.0x00158d0001581109_humidity")|float <= 30 %}
              deep-orange
              {% elif states("sensor.0x00158d0001581109_humidity")|float <= 40 %}
              yellow
              {% elif states("sensor.0x00158d0001581109_humidity")|float <= 50 %}
              light-blue
              {% elif states("sensor.0x00158d0001581109_humidity")|float <= 60 %}
              blue
              {% elif states("sensor.0x00158d0001581109_humidity")|float > 60 %}
              indigo
              {% endif %}
            icon: mdi:water-percent
            tap_action:
              action: more-info
      - type: markdown
        content: >
          ### Sonoff SAWF-08P
      - type: grid
        square: false
        columns: 3
        cards:
          - type: custom:mushroom-template-card
            primary: Температура
            secondary: |-
              {{ states('sensor.kn_co2_temperature') }} С°
            layout: vertical
            entity: sensor.kn_co2_temperature
            icon_color: |-
              {% if states("sensor.kn_co2_temperature")|float <= -10 %}
              indigo
              {% elif states("sensor.kn_co2_temperature")|float <= 0 %}
              blue
              {% elif states("sensor.kn_co2_temperature")|float <= 10 %}
              light-blue
              {% elif states("sensor.kn_co2_temperature")|float <= 20 %}
              cyan
              {% elif states("sensor.kn_co2_temperature")|float <= 25 %}
              yellow
              {% elif states("sensor.kn_co2_temperature")|float <= 30 %}
              amber
              {% elif states("sensor.kn_co2_temperature")|float <= 40 %}
              orange
              {% endif %}
            icon: mdi:temperature-celsius
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Вологість
            secondary: |-
              {{ states('sensor.kn_co2_humidity') }} %
            layout: vertical
            entity: sensor.kn_co2_humidity
            icon_color: |-
              {% if states("sensor.kn_co2_humidity")|float <= 30 %}
              deep-orange
              {% elif states("sensor.kn_co2_humidity")|float <= 40 %}
              yellow
              {% elif states("sensor.kn_co2_humidity")|float <= 50 %}
              light-blue
              {% elif states("sensor.kn_co2_humidity")|float <= 60 %}
              blue
              {% elif states("sensor.kn_co2_humidity")|float > 60 %}
              indigo
              {% endif %}
            icon: mdi:water-percent
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: CO2
            secondary: |-
              {{ states('sensor.kn_co2_carbon_dioxide') }} ppm
            layout: vertical
            entity: sensor.kn_co2_carbon_dioxide
            icon_color: |-
              {% if states("sensor.kn_co2_carbon_dioxide")|float <= 500 %}
              green
              {% elif states("sensor.kn_co2_carbon_dioxide")|float <= 700 %}
              light-green
              {% elif states("sensor.kn_co2_carbon_dioxide")|float <= 800 %}
              lime
              {% elif states("sensor.kn_co2_carbon_dioxide")|float <= 1000 %}
              yellow
              {% elif states("sensor.kn_co2_carbon_dioxide")|float <= 1200 %}
              orange
              {% elif states("sensor.kn_co2_carbon_dioxide")|float > 1200 %}
              red
              {% endif %}
            icon: mdi:molecule-co2
            tap_action:
              action: more-info



      - type: markdown
        content: >
          ### Балкон

      - type: horizontal-stack
        cards:

          - type: custom:mushroom-template-card
            primary: Температура балкона
            secondary: |-
              {{ states('sensor.0xa4c1381ff5d0e03f_temperature') }} С°
            layout: vertical
            entity: sensor.0xa4c1381ff5d0e03f_temperature
            icon_color: |-
              {% if states("sensor.0xa4c1381ff5d0e03f_temperature")|float <= -10 %}
              indigo
              {% elif states("sensor.0xa4c1381ff5d0e03f_temperature")|float <= 0 %}
              blue
              {% elif states("sensor.0xa4c1381ff5d0e03f_temperature")|float <= 10 %}
              light-blue
              {% elif states("sensor.0xa4c1381ff5d0e03f_temperature")|float <= 20 %}
              cyan
              {% elif states("sensor.0xa4c1381ff5d0e03f_temperature")|float <= 25 %}
              yellow
              {% elif states("sensor.0xa4c1381ff5d0e03f_temperature")|float <= 30 %}
              amber
              {% elif states("sensor.0xa4c1381ff5d0e03f_temperature")|float <= 40 %}
              orange
              {% endif %}
            icon: mdi:temperature-celsius
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Вологість балкона
            secondary: |-
              {{ states('sensor.0xa4c1381ff5d0e03f_humidity') }} %
            layout: vertical
            entity: sensor.0xa4c1381ff5d0e03f_humidity
            icon_color: |-
              {% if states("sensor.0xa4c1381ff5d0e03f_humidity")|float <= 30 %}
              deep-orange
              {% elif states("sensor.0xa4c1381ff5d0e03f_humidity")|float <= 40 %}
              yellow
              {% elif states("sensor.0xa4c1381ff5d0e03f_humidity")|float <= 50 %}
              light-blue
              {% elif states("sensor.0xa4c1381ff5d0e03f_humidity")|float <= 60 %}
              blue
              {% elif states("sensor.0xa4c1381ff5d0e03f_humidity")|float > 60 %}
              indigo
              {% endif %}
            icon: mdi:water-percent
            tap_action:
              action: more-info

############################ Колонка 2 ############################
  - type: grid
    cards:

      - type: markdown
        content: >
          ### Опалення

      - type: horizontal-stack
        cards:

          - type: custom:mushroom-template-card
            primary: Режим
            secondary: |-
              {% if is_state("switch.kn_radiator_mode", "on") %}
              Опалення увімкнене
              {% else %}
              Опалення вимкнене
              {% endif %}
            layout: vertical
            tap_action:
              action: toggle
            entity: switch.kn_radiator_mode
            icon: |-
              {% if is_state("switch.kn_radiator_mode", "on") %}
              phu:wiser-thermostat-off
              {% else %}
              phu:wiser-thermostat-on
              {% endif %}
            multiline_secondary: true
            icon_color: |-
              {% if is_state("switch.kn_radiator_mode", "on") %}
              orange
              {% else %}
              grey
              {% endif %}

          - type: custom:mushroom-climate-card
            entity: climate.0xa4c13833d5060f8b
            hvac_modes:
              - heat
            show_temperature_control: true
            layout: vertical
            fill_container: true
            collapsible_controls: true
            primary_info: name
            secondary_info: state
            name: Кухня

      - type: horizontal-stack
        cards:

          - type: custom:mushroom-template-card
            primary: Синхронізація
            secondary: |-
              {% set m = states('sensor.0x00158d0001581109_temperature') | float(0) %}
              {% set s = states('number.0xa4c13833d5060f8b_external_temperature_input') | float(0) %}
              {% if (m - s) | abs > 0.5 %}
              Розбіжність > 0.5 С°
              {% else %}
              ОК
              {% endif %}
            layout: vertical
            tap_action:
              action: more-info
            entity: automation.kn_heat_temperature_sync
            icon: mdi:sync
            multiline_secondary: true
            icon_color: |-
              {% set m = states('sensor.0x00158d0001581109_temperature') | float(0) %}
              {% set s = states('number.0xa4c13833d5060f8b_external_temperature_input') | float(0) %}
              {% if (m - s) | abs > 0.5 %}
              amber
              {% else %}
              green
              {% endif %}

          - type: custom:mushroom-template-card
            primary: |-
              Датчик {{ states('sensor.0x00158d0001581109_temperature') }} С°
            secondary: |-
              Надіслано {{ states('number.0xa4c13833d5060f8b_external_temperature_input') }} С°
            layout: vertical
            entity: sensor.0x00158d0001581109_temperature
            icon_color: |-
              {% if is_state("switch.kn_radiator_mode", "on") %}
              amber
              {% else %}
              grey
              {% endif %}
            icon: mdi:temperature-celsius
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: |-
              Головка {{ states('sensor.0xa4c13833d5060f8b_local_temperature') }} С°
            secondary: |-
              Різниця {{ (states('sensor.0x00158d0001581109_temperature') | float(0) - states('sensor.0xa4c13833d5060f8b_local_temperature') | float(0)) | round(1) }} С°
            layout: vertical
            entity: sensor.0xa4c13833d5060f8b_local_temperature
            icon_color: |-
              {% if is_state("switch.kn_radiator_mode", "on") %}
              amber
              {% else %}
              grey
              {% endif %}
            icon: mdi:compare-horizontal
            tap_action:
              action: more-info

      - type: entities
        style: |
          ha-card {
            color: #f8ffd8;
            --paper-item-icon-color: #f8ffd8;
            --paper-item-icon-active-color: #f8ffd8;
            font-weight: bold;
            font-size: 14px;
          }
        show_header_toggle: false
        entities:
          - type: divider
          - entity: input_number.kn_heat_comfort_temperature
            name: Цільова температура
          - type: divider
          - entity: input_number.kn_heat_open_window_temperature
            name: Температура провітрювання
          - type: divider
          - entity: input_number.kn_heat_eco_temperature
            name: Нічна температура
          - type: divider
          # перевірте entity_id батареї нової головки (Zigbee2MQTT зазвичай дає sensor.<id>_battery)
          - entity: sensor.0xa4c13833d5060f8b_battery
            type: custom:multiple-entity-row
            name: Батарея
            show_state: true
            entities:
              - entity: climate.0xa4c13833d5060f8b
                attribute: last_seen
                format: relative
                name: Відгук

############################ Колонка 3 ############################
  - type: grid
    cards:

      - type: markdown
        content: >
          ### Бойлер

      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.current_time
          - entity: switch.0xa4c1388ce0ff53a8_mode

          - entity: switch.0xa4c1388ce0ff53a8
            type: custom:multiple-entity-row
            toggle: true
            state_color: true
            name: Бойлер
            secondary_info: last-changed
            state_header: Живлення
            entities:
              - entity: sensor.0xa4c1388ce0ff53a8_power
                name: Потужність
                unit: 'Вт'

      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.kn_boiler_energy_meter